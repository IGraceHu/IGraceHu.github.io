<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Timelines</title>

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <script src="jquery-4.0.0.min.js"></script>
    <script src="timelines.js"></script>

    <style>
        * {
            font-family: Arial, sans-serif;

            --tl-col-width: 400px;
            --tl-width: 90px;

            --bg-color: rgb(44, 41, 52);
            --text-color: rgba(255, 255, 255, 0.867);

            font-size: 12px;
        }

        body {
            margin: 0;
            background-color: var(--bg-color);
            color: var(--text-color);
            
        }



        .button {
            font-size: 1rem;
            color: var(--text-color);
            background-color: rgb(35, 33, 84);
            margin: auto 5px;
            padding: 7px 10px;
            border: 0;
            border-radius: 5px;
            border: 2px solid rgba(255, 255, 255, 0.25);
            box-sizing: border-box;

            transition: opacity .2s;
        }

        .button.red {
            background-color: rgb(84, 33, 33);
        }

        .button:hover {
            cursor: pointer;
            opacity: 0.6;
        }

        .button:disabled, .button:disabled:hover {
            cursor: auto;
            background-color: rgb(172, 193, 212);
            color: rgb(77, 109, 137);
        }

        .edit-button {
            color: rgba(255, 255, 255, 0.6);
            transition: color 0.2s;
        }

        .edit-button:hover {
            cursor: pointer;
            color: rgba(255, 255, 255);
        }




        #popup-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #00000043;
            z-index: 100;
            /* display: none; */
        }

        .popup {
            background-color: var(--bg-color);
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            padding: 20px;
            border: 2px solid rgba(255, 255, 255, 0.25);
            border-radius: 10px;
            z-index: 101;

            min-width: 600px;

            & .popup-footer {
                margin-top: 10px;
                & .button:first-of-type {
                    margin-left: 0;
                }
            }

            & .delete-button {
                float: right;
            }
        }

        #popup-clear {
            min-width: 200px;
        }

        form {
            display: grid;
            grid-template-columns: auto auto;
            gap: 12px;
            column-gap: 18px;

            & .span {
                grid-column: 1 / span 2;
            }

            & #recurring-options {
                display: grid;
                grid-template-columns: auto auto;
                gap: 12px;
            }
            
            & .error-messages {
                font-style: italic;
                color: rgb(255, 190, 190);
            }

            & .color-form {
                display: flex;
                align-items: center;
            }
        }

        input[type="text"], input[type="number"], select {
            width: 100%;
            margin: 4px 0;
            padding: 6px;
            border: 2px solid rgba(255, 255, 255, 0.25);
            border-radius: 4px;
            box-sizing: border-box;

            background-color: var(--bg-color);
            color: var(--text-color);

            transition: border 0.2s;
        }
        input[type="text"]:hover, input[type="number"]:hover, select:hover {
            border: 2px solid rgba(255, 255, 255, 0.15);
        }
        input[type="text"]:disabled, input[type="number"]:disabled {
            border: 2px solid rgba(255, 255, 255, 0.1);
        }
        select {
            width: auto;
            cursor: pointer;
        }
        input[type="color"] {
            margin-left: 4px;
            padding: 0;
            border: 2px solid #615e67;
            border-radius: 4px;
            box-sizing: border-box;
            cursor: pointer;
            transition: border 0.2s;
        }
        input[type="color"]:hover {
            border-color: #535057;
        }
        




        #header {
            position: sticky;
            top: 0;
            left: 0;
            min-height: 50px;
            width: 100%;
            border-bottom: 4px solid rgba(255, 255, 255, 0.5);
            background-color: var(--bg-color);
            z-index: 99;
        }

        #header-config {
            padding: 10px;
            display: grid;
            gap: 4px;
            grid-template-columns: auto auto auto min-content;
        }

        #file-config-buttons {
            text-align: center;
            display: flex;
            gap: 4px;

            & > * {
                width: 100px;
                box-sizing: border-box;
            }
        }

        #world-info {
            & > * {
                padding: 0 10px;
            }

            & #world-name-container {
                font-size: 1.5rem;
                margin: 0;
                padding-left: 0;
                display: inline;
            }

            & #edit-world-button {
                padding-left: 0;
            }
        }

        #time-info {
            display: flex;
            align-items:center;

            & > * {
                padding: 0 10px;
            }

            & #current-time-button {
                display: block;
                /* font-size: .75rem; */
                padding: 5px 5px;
            }
            
        }

        @media screen and (max-width: 1300px) {
            #header-config { grid-template-columns: auto auto min-content; }
            
            #create-buttons { order: 3; grid-column: 1 / span 3; }
            #create-timeline-button { margin-left: 0; }
            #file-config-buttons { order: 2 }
        }

        @media screen and (max-width: 1000px) {
            #header-config { grid-template-columns: auto min-content; }
            
            #current-time-container { padding-left: 0; }
            #create-buttons { grid-column: 1 / span 1; }
            #file-config-buttons { 
                flex-direction: column;
                grid-row: 1 / span 3;
                grid-column: 2;
            }
        }

        .not-saved {
            background-color:rgb(48, 97, 137);
            border-color: rgb(136, 179, 215);
        }

        #upload-data-input {
            display: none;
        }

        

        

        




        #timeline-names-container {
            display: flex;
            padding-bottom: 4px;

            & .timeline-name-container {
                width: var(--tl-col-width);
                padding-left: 10px;
                box-sizing: border-box;
                flex-shrink: 0;
            }

            & .timeline-edit {
                display: none;
                padding-left: 10px;
            }

            & .timeline-name:hover + .timeline-edit, .timeline-edit:hover {
                display: inline;
                cursor: pointer;
            }
        }

        #main {
            position: relative;
            top: 30px;
        }

        #time-interval-container {
            position: fixed;
            top: 25vh;
            right: 30px;
            padding: 10px 0;
            z-index: 20;

            & #time-interval {
                height: 50vh;
                writing-mode: vertical-lr;
                direction: rtl;
                vertical-align: middle;
            }
        }


        #timelines-container {
            position: relative;
            display: flex;
            z-index: 10;
        }

        #markings-container {
            position: absolute;
            top: 0;
            width: 100%;
            z-index: 11;
        }

        #events-container {
            position: absolute;
            top: 0;
            display: flex;
            z-index: 12;
        }

        

        .timeline-container {
            position: relative;
            padding-left: 10px;
            width: var(--tl-col-width);
            box-sizing: border-box;
            flex-shrink: 0;
            z-index: 1;

            & .tl-line {
                position: relative;
                float: left;
                border-right: 2px solid var(--text-color);
                box-sizing: border-box;
                width: 90px;
                height: 100%;
            }

            & .tl-tick {
                position: absolute;
                right: -14px;
                height: 2px;

                display: flex;
                align-items: center;

                & .tl-label {
                    font-size: 0.75rem;
                    padding: 0 4px;
                    background-color: var(--bg-color);
                }

                & .tl-dash {
                    margin-right: 4px;
                    height: 2px;
                    width: 18px;
                    background-color: var(--text-color);
                }
            }
        }


        .events-container {
            position: relative;
            width: var(--tl-col-width);
            box-sizing: border-box;
            padding-left: calc(var(--tl-width) + 10px + 12px);
            height: 100%;
            min-height: 100px;
            z-index: 2;
        }

        .event-container {
            position: absolute;
            background-color:#40107580;
            box-shadow: inset 0 0 0 2px rgba(255, 255, 255, 0.25);
            box-sizing: border-box;
            
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            transition: opacity .2s;

            & .event {
                position: relative;
                /* left: -10px; */
                height: 2px;
                width: max-content;
                display: flex;
                align-items: center;
            }

            & .event::before {
                content: "";
                display: block;
                position: absolute;
                width: 100%;
                height: 2px;
                background-color: var(--bg-color);
                z-index: 9;
            }

            /* In event  */
            & .event-label {
                display: flex;
                align-items: center;
                padding: 4px 12px;

                background-color: var(--bg-color);
                background-color:rgb(64, 16, 117);
                border: 2px solid rgba(255, 255, 255, 0.3);
                border-radius: 16px;
                box-sizing: border-box;
                z-index: 10;

                & .ev-time {
                    margin-right: 6px;
                    font-style: italic;
                    color: var(--text-color);
                    opacity: 0.75;
                }
            }

            & .event-edit {
                display: none;
                position: absolute;
                top: -0.765rem;
                right: -4.5rem;
                padding: 4px 8px 4px 16px;
                z-index: 9;

                /* background-color: var(--bg-color); */
            }

        }

        .event-container:hover > .event-edit, .vent-edit:hover {
            display: block;
            cursor: pointer;
        }

        .event-container:hover, .event-container:hover .event-label {
            opacity: 0.8;
            cursor: pointer;
        }

        
        .benchmark {
            position: absolute;
            left: 0;
            width: 100%;
            min-height: 2px;
            box-sizing: border-box;
            z-index: 1;
        }

        

        #current-line {
            position: absolute;
            left: 0;
            height: 2px;
            width: 100%;
            background-color: var(--text-color);
            display: flex;
            font-size: 0.75rem;
            z-index: 19;

            scroll-behavior: smooth;

            & * {
                margin: 3px 10px;
                width: var(--tl-col-width);
                flex-shrink: 0;
            }
        }

        #current-line::before {
            content: "Current";
            position: absolute;
            margin: 3px 10px;
            top: calc(-1rem - 6px);
            font-size: 1rem;
        }

        .mark-line {
            position: absolute;
            top: 0;
            left: 0;
            height: 2px;
            width: 100%;
            background-color: var(--text-color);
            opacity: 0.5;
            z-index: 2;
            display: flex;

            & * {
                font-size: 0.75rem;
                margin: 3px 10px;
                width: var(--tl-col-width);
                flex-shrink: 0;
            }
        }

        

        
    </style>
</head>
<body>
    <div id="popup-container"></div>
    <div id="header">
        <div id="header-config">
            <div id="world-info">
                <h1 id="world-name-container"></h1> <span id="edit-world-button" class="edit-button">Edit <i class="bi bi-pencil-fill"></i></span>
            </div>

            <div id="time-info">
                <div id="current-time-container">Current Time: <span id="current-time"></span></div>
                <button id="current-time-button" class="button">Jump to Current Time</button>
            </div>

            <div id="create-buttons">
                <button id="create-timeline-button" class="button">Create Timeline</button>
                <button id="create-event-button" class="button">Create Event</button>
            </div>
            
            <div id="file-config-buttons">
                <button id="save-data-button" class="button">Save</button>
                <label for="upload-data-input" class="button">Load</label>
                <input id="upload-data-input" type="file" accept=".json" class="button">
                <button id="clear-data-button" class="button red">Clear</button>
            </div>
            
        </div>

        <div id="timeline-names-container"></div>
    </div>
    <div id="main">
        <div id="timelines-container"></div>
        <div id="markings-container"></div>
        <div id="events-container"></div>


        <div id="current-line"></div>

        <div id="time-interval-container">
            <input type="range" min="5" max="100" value="10" step="5" class="slider" id="time-interval" orient="vertical">
        </div>
                
        </div>
    </div>
</body>
</html>
